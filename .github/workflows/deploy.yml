name: Build and deploy

# Builds the Vite app on every push and pull request so a broken build is
# caught before it lands, and publishes to the gh-pages branch on pushes to
# main. Before this workflow existed, deploys happened by someone building
# locally and pushing dist/ straight to gh-pages by hand — the branch drifted
# ahead of any commit in this repository with no way to tell what shipped or
# why. This makes main the single source of truth: what's live is always
# exactly what a commit on main produces.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # vite.config.ts stamps public/version.json with the same build ID it
      # bakes into the JS bundle via `define: { __BUILD_ID__ }`, so the two
      # always agree — src/hooks/useVersionCheck.ts compares them to decide
      # whether to show the "new version available" banner. Do NOT overwrite
      # dist/version.json after this step: replacing its build ID with
      # anything else (a commit SHA, a timestamp) desyncs it from the value
      # already embedded in the JS, and every visitor sees a false "update
      # available" banner permanently, even on the current build.
      - run: npm run build

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Checked out as a worktree from the existing gh-pages branch (not
      # created fresh) so this continues its commit history rather than
      # replacing it with an orphan branch.
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages
          git worktree add ../gh-pages-deploy origin/gh-pages

          rsync -a --delete --exclude .git dist/ ../gh-pages-deploy/

          cd ../gh-pages-deploy
          git add -A
          if git diff --cached --quiet; then
            echo "Build output unchanged, nothing to deploy."
            exit 0
          fi

          SUBJECT="$(git -C "$GITHUB_WORKSPACE" log -1 --format=%s "$GITHUB_SHA")"
          git commit -q -m "Deploy: ${SUBJECT}" -m "Source: ${GITHUB_SHA}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
