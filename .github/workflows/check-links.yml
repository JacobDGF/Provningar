name: Check prövning links

# Every listing in src/data/exams.ts promises to take the user to a page where
# they can actually register. Swedish municipalities restructure their sites
# constantly — a sweep in August 2026 found 12 of ~100 URLs already dead, all of
# them shipped and pointing users at 404s. This runs weekly so the next batch of
# rot gets reported as an issue instead of discovered by someone trying to book
# an exam.
#
# Deliberately does NOT run on pull requests: municipal sites rate-limit and
# occasionally time out, and a checker that randomly blocks merges gets disabled.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: check
        run: npm run check:links | tee link-report.txt
        continue-on-error: true

      - name: Open an issue for broken links
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "The weekly link sweep found registration or info URLs that no longer resolve."
            echo "Users clicking these land on a 404 instead of a booking page."
            echo
            echo '```'
            cat link-report.txt
            echo '```'
            echo
            echo "**Acceptance criteria**"
            echo "- [ ] Every URL listed as broken is replaced with a live page on the same provider's site"
            echo "- [ ] Where the provider has an open booking form (Alvis \`/provning/amnesomrade\`, an e-tjänst, a webshop), the replacement points at that rather than a landing page"
            echo "- [ ] \`npm run check:links\` exits 0"
            echo "- [ ] \`verifiedAt\` is bumped on every listing that changed"
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > issue-body.md

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Broken prövning links found by the weekly sweep ($(date -u +%Y-%m-%d))" \
            --body-file issue-body.md
