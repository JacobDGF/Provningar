<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prövningstillfällen — Prövningar</title>
<meta name="description" content="Se alla prövningstillfällen i din stad: ämne, datum, anordnare och sista anmälningsdag.">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="styles.css">
  <script src="data.js"></script>
  <style>
    body { margin: 0; }
    @keyframes bs-rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
  </style>
</helmet>

<div style="width:100%;min-height:100vh;background:var(--color-bg);color:var(--color-text);">

  <header data-screen-label="nav" style="position:sticky;top:0;z-index:1000;background:var(--color-bg);">
    <div class="nav" style="max-width:1160px;margin:0 auto;padding-top:var(--space-3);padding-bottom:var(--space-3);">
      <a href="Provningar%20Landing.dc.html" class="nav-brand" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-size:18px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="var(--color-accent)" stroke-width="1.5"/>
          <circle cx="12" cy="12" r="2.5" fill="var(--color-accent-2)"/>
          <line x1="12" y1="0" x2="12" y2="6" stroke="var(--color-accent)" stroke-width="1.5"/>
          <line x1="12" y1="18" x2="12" y2="24" stroke="var(--color-accent)" stroke-width="1.5"/>
        </svg>
        Prövningar
      </a>
      <a href="Provningar%20Landing.dc.html#hur-det-fungerar">Hur det fungerar</a>
      <a href="Provningar%20Landing.dc.html#stader">Städer</a>
      <a href="Om%20oss.dc.html">Om oss</a>
      <a href="Skapa%20konto.dc.html" class="btn btn-primary">Skapa konto</a>
    </div>
  </header>

  <section data-screen-label="city-header" style="max-width:1160px;margin:0 auto;padding:var(--space-8) var(--space-4) var(--space-6);animation:bs-rise 0.7s ease both;">
    <a href="Provningar%20Landing.dc.html#stader" class="btn btn-ghost" style="padding-inline:0;margin-bottom:var(--space-3);">← Alla städer</a>
    <h6 style="color:var(--color-accent-700);margin-bottom:var(--space-2);">{{ coords }}</h6>
    <h1 style="font-size:52px;margin-bottom:var(--space-2);">{{ cityName }}</h1>
    <p class="text-muted" style="font-size:17px;max-width:46ch;">{{ intro }}</p>
  </section>

  <section data-screen-label="city-table" style="max-width:1160px;margin:0 auto;padding:0 var(--space-4) calc(var(--space-8) * 2);">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">Ämne</th>
          <th scope="col">Datum</th>
          <th scope="col">Anordnare</th>
          <th scope="col">Sista anmälan</th>
          <th scope="col"><span style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Åtgärder</span></th>
        </tr>
      </thead>
      <tbody>
        <sc-for list="{{ rows }}" as="row" hint-placeholder-count="8">
          <tr>
            <td style="font-family:var(--font-heading);font-weight:var(--font-heading-weight);">{{ row.subject }}</td>
            <td>{{ row.date }}</td>
            <td>{{ row.org }}</td>
            <td>{{ row.deadline }}</td>
            <td style="text-align:right;"><a href="{{ row.href }}" class="btn btn-ghost">Detaljer →</a></td>
          </tr>
        </sc-for>
      </tbody>
    </table>
  </section>

  <footer style="max-width:1160px;margin:0 auto;padding:var(--space-6) var(--space-4) var(--space-8);display:flex;align-items:center;justify-content:space-between;">
    <div class="nav-brand" style="margin:0;font-size:15px;">Prövningar</div>
    <p class="text-muted" style="font-size:13px;margin:0;">© 2026 Prövningar · Ett kostnadsfritt projekt</p>
  </footer>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    if (!window.PROVNINGAR) {
      let attempts = 0;
      this.t = setInterval(() => {
        attempts++;
        if (window.PROVNINGAR) { clearInterval(this.t); this.forceUpdate(); }
        else if (attempts > 100) { clearInterval(this.t); }
      }, 80);
    }
  }
  componentWillUnmount() { clearInterval(this.t); }

  renderVals() {
    const name = new URLSearchParams(location.search).get("stad") || "Stockholm";
    const D = window.PROVNINGAR;
    if (!D) return { cityName: name, coords: "", intro: "", rows: [] };
    const city = D.cities.find((c) => c.name === name) || D.cities[0];
    const rows = D.getTillfallen(city.name).map((t) => ({
      subject: t.subject,
      date: t.date,
      org: t.org,
      deadline: t.deadline,
      href: "Provning.dc.html?id=" + encodeURIComponent(t.id),
    }));
    return {
      cityName: city.name,
      coords: city.lat.toFixed(4) + "° N · " + city.lng.toFixed(4) + "° Ö",
      intro: rows.length + " prövningstillfällen i " + city.name + " just nu. Anmälan sker direkt hos anordnaren — helt kostnadsfritt att söka här.",
      rows,
    };
  }
}
</script>
</body>
</html>
